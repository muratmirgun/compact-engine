version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - revive
    - gocritic
    - gocyclo
    - bodyclose
    - noctx
    - nolintlint
  settings:
    gocyclo:
      min-complexity: 40
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
